name: Follow Gostman releases

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the latest release
        id: write
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(bash update.sh)" >> "$GITHUB_OUTPUT"
      - name: Commit
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Gostman ${{ steps.write.outputs.version }}"
          git push
